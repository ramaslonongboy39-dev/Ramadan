<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Mahasiswa</title>
</head>
<body>

    <header>
        <h1>Biodata Mahasiswa</h1>
        <hr>
    </header>

    <nav>
        <a href="index.html">Beranda (Index)</a> |
        <a href="#biodata">Data Mahasiswa</a> |
        <a href="#form">Form Biodata</a>
    </nav>
    <hr>

    <main>
        <section id="biodata">
            <h2>Data Mahasiswa</h2>
            <table border="1" cellpadding="8" cellspacing="0">
                <tr>
                    <th>Data</th>
                    <th>Keterangan</th>
                </tr>
                <tr>
                    <td>NIM</td>
                    <td>312510256</td>
                </tr>
                <tr>
                    <td>Nama</td>
                    <td>Ramadan</td>
                </tr>
                <tr>
                    <td>Program Studi</td>
                    <td>Teknik Informatika</td>
                </tr>
            </table>
        </section>

        <br>

        <section id="form">
            <h2>Form Biodata</h2>
            <form action="#" method="post">
                <p>
                    <label for="nama">Nama:</label><br>
                    <input type="text" id="nama" name="nama" required>
                </p>
                <p>
                    <label for="email">Email:</label><br>
                    <input type="email" id="email" name="email" required>
                </p>
                <p>
                    <label for="prodi">Program Studi:</label><br>
                    <select id="prodi" name="prodi" required>
                        <option value="">-- Pilih --</option>
                        <option value="ti">Teknik Informatika</option>
                        <option value="si">Sistem Informasi</option>
                    </select>
                </p>
                <p>
                    <label for="alamat">Alamat:</label><br>
                    <textarea id="alamat" name="alamat" rows="4" cols="40" required></textarea>
                </p>
                <p>
                    <button type="submit">Simpan</button>
                    <button type="reset">Reset</button>
                </p>
            </form>
        </section>
    </main>

    <hr>

    <footer>
        <p>&copy; 2026 Teknik Informatika - Universitas Pelita Bangsa</p>
    </footer>

</body>
</html>
